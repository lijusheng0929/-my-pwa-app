<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>仿微博基金</title>
  <style>
    /* ====== 基础与通用样式 ====== */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; }
    body { background: #f2f2f2; color: #333; overflow-x: hidden; }
    .page { display: none; min-height: 100vh; flex-direction: column; background: #f2f2f2; }
    .page.active { display: flex; }
    
    .edit-btn { position: fixed; bottom: 80px; right: 20px; background: #007aff; color: #fff; padding: 12px 20px; border-radius: 30px; font-size: 15px; font-weight: bold; box-shadow: 0 4px 15px rgba(0,122,255,0.4); z-index: 1000; border: none; cursor: pointer; }
    .editing [contenteditable="true"] { border-bottom: 1px dashed #007aff; background: rgba(0,122,255,0.1); outline: none; }

    /* ====== 第一页：我的 ====== */
    .top-bar { display: flex; justify-content: flex-end; padding: 15px; gap: 20px; position: absolute; top: 0; right: 0; width: 100%; z-index: 10; }
    .top-bar span { font-size: 22px; color: #333; font-weight: bold;}
    .profile-section { background: #fff; padding: 50px 20px 20px; position: relative; }
    .profile-info-top { display: flex; align-items: center; gap: 15px; margin-bottom: 15px;}
    .profile-info-top img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; border: 1px solid #eee; background: #f0f0f0;}
    .profile-text h2 { font-size: 20px; font-weight: 600; display: flex; align-items: center; gap: 5px;}
    .vip-tag { background: #555; color: #ffd700; font-size: 10px; padding: 2px 6px; border-radius: 10px; font-weight: normal;}
    .profile-text p { font-size: 14px; color: #666; margin-top: 5px;}
    .status-btn { display: inline-flex; align-items: center; gap: 5px; background: #f5f5f5; padding: 4px 10px; border-radius: 15px; font-size: 12px; color: #333; margin-top: 8px;}
    .svip-banner { background: linear-gradient(90deg, #e3f2fd, #f0f8ff); border-radius: 12px; padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; margin-top: 15px; border: 1px solid #d0e3f0;}
    .svip-banner .left { font-size: 13px; color: #555; display: flex; flex-direction: column; gap: 4px;}
    .svip-banner .left span:first-child { font-weight: bold; color: #333; }
    .svip-banner .right-btn { background: #fff; border: 1px solid #ccc; padding: 4px 10px; border-radius: 15px; font-size: 12px; color: #333;}

    .stats-bar { display: flex; justify-content: space-around; padding: 15px 0; background: #fff; margin-bottom: 10px;}
    .stat-item { text-align: center; }
    .stat-item .num { font-size: 18px; font-weight: bold; color: #333; }
    .stat-item .label { font-size: 12px; color: #888; margin-top: 4px;}

    .grid-menu { background: #fff; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 0; padding: 20px 0; margin-bottom: 10px; border-radius: 12px; margin-left: 10px; margin-right: 10px;}
    .grid-item { text-align: center; font-size: 13px; color: #333; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 8px;}
    .grid-item .icon-box { width: 36px; height: 36px; display: flex; justify-content: center; align-items: center; font-size: 26px; position: relative;}
    .red-dot { position: absolute; top: -2px; right: -2px; width: 8px; height: 8px; background: #ff3b30; border-radius: 50%; }

    .task-section { background: #fff; padding: 15px; margin-bottom: 10px; border-radius: 12px; margin-left: 10px; margin-right: 10px;}
    .task-header { display: flex; gap: 20px; font-size: 15px; margin-bottom: 15px; align-items: center;}
    .task-header span { color: #666; font-weight: normal; }
    .task-header span.active { color: #ff8200; font-weight: bold; border-bottom: 2px solid #ff8200; padding-bottom: 5px;}
    .task-content { display: flex; justify-content: space-between; align-items: center; }
    .task-item h4 { font-size: 15px; margin-bottom: 5px; color: #333;}
    .task-item p { font-size: 13px; color: #ff8200; }
    .btn-orange { background: #ff8c00; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 14px; font-weight: bold; cursor: pointer;}

    .wallet-preview { background: #fff; padding: 15px; margin-bottom: 10px; border-radius: 12px; margin-left: 10px; margin-right: 10px;}
    .wallet-header { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 15px; }
    .wallet-header .title { font-weight: bold; color: #333;}
    .wallet-header .more { color: #999; font-size: 13px;}
    .wallet-grid { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; }
    .wallet-col h4 { font-size: 16px; color: #333; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 4px;}
    .wallet-col h4 span { font-size: 12px; color: #999;}
    .wallet-col p { font-size: 12px; color: #666; }

    .recent-visits { background: #fff; padding: 15px; margin-left: 10px; margin-right: 10px; border-radius: 12px; margin-bottom: 20px;}
    .recent-header { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; margin-bottom: 15px;}
    .recent-header span:last-child { font-weight: normal; color: #999; font-size: 13px;}
    .avatar-list { display: flex; gap: 15px; overflow-x: auto; padding-bottom: 10px;}
    .avatar-item { display: flex; flex-direction: column; align-items: center; position: relative; }
    .avatar-item img { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; border: 1px solid #eee; }
    .avatar-item .vip-dot { position: absolute; bottom: 0; right: 0; background: #ff9800; color: #fff; font-size: 10px; width: 16px; height: 16px; display: flex; justify-content: center; align-items: center; border-radius: 50%; border: 2px solid #fff;}
    .avatar-item .red-dot { position: absolute; top: 0; right: 0; width: 10px; height: 10px; background: #ff3b30; border-radius: 50%; border: 1px solid #fff;}

    .bottom-nav { margin-top: auto; display: flex; background: #fff; padding: 8px 0; border-top: 1px solid #eee; position: sticky; bottom: 0; z-index: 10; }
    .nav-item { flex: 1; text-align: center; font-size: 11px; color: #999; display: flex; flex-direction: column; align-items: center; gap: 4px; position: relative; }
    .nav-item.active { color: #333; font-weight: bold;}
    .nav-icon-wrap { position: relative; width: 30px; height: 26px; display: flex; justify-content: center; align-items: center; }
    .nav-icon-wrap i { font-style: normal; font-size: 22px; }
    .nav-badge { position: absolute; top: -4px; right: -6px; background: #ff3b30; color: #fff; font-size: 10px; padding: 1px 5px; border-radius: 10px; border: 1.5px solid #fff; min-width: 16px; text-align: center; line-height: 1.2; transform: scale(0.9); }

    /* ====== 页面 2：微博钱包 ====== */
    #page2 { background: #f5f5f5; padding-bottom: 20px;}
    .wallet-header-new { background: linear-gradient(180deg, #ffdab9 0%, #f5f5f5 100%); padding-top: 10px;}
    .wallet-nav { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; font-size: 18px; font-weight: bold;}
    .wallet-main-card { background: #fff; border-radius: 16px; margin: 10px 15px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .wallet-top-banner { background: linear-gradient(90deg, #ffb347, #ffcc33); padding: 15px; display: flex; align-items: center; color: #fff; gap: 10px;}
    .wallet-top-banner .icon { background: #fff; color: #ffb347; border-radius: 50%; width: 30px; height: 30px; display: flex; justify-content: center; align-items: center; font-weight: bold;}
    .wallet-data-row { display: flex; padding: 15px; border-bottom: 1px solid #eee;}
    .wallet-data-col { flex: 1; }
    .wallet-data-col:first-child { border-right: 1px solid #eee; padding-right: 15px;}
    .wallet-data-col:last-child { padding-left: 15px;}
    .wallet-data-col p { font-size: 13px; color: #666; margin-bottom: 5px;}
    .wallet-data-col h2 { font-size: 28px; font-weight: normal; margin-bottom: 10px;}
    .wallet-data-col .sub-text { font-size: 12px; color: #ff3b30; display: flex; align-items: center; gap: 5px;}
    .wallet-user-row { display: flex; justify-content: space-between; align-items: center; padding: 15px;}
    .wallet-user-info { display: flex; align-items: center; gap: 10px; font-size: 14px;}
    .wallet-user-info img { width: 30px; height: 30px; border-radius: 50%;}
    .wallet-user-info .tag { background: #fff1d0; color: #ff9800; font-size: 10px; padding: 2px 6px; border-radius: 10px; border: 1px solid #ffd54f;}
    .wallet-user-right { font-size: 13px; color: #999;}

    .small-circles { display: flex; justify-content: space-around; background: #fff; margin: 10px 15px; border-radius: 12px; padding: 15px 0;}
    .circle-item { text-align: center; font-size: 13px; color: #333;}
    .circle-icon { font-size: 24px; margin-bottom: 5px;}
    .daily-bonus-bar { background: #fffcf0; color: #ff9800; text-align: center; font-size: 13px; padding: 10px; border-radius: 0 0 12px 12px; margin: -10px 15px 10px;}

    .big-grid-container { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px 5px; background: #fff; margin: 10px 15px; border-radius: 12px; padding: 20px 10px;}
    .big-grid-item { text-align: center; font-size: 12px; color: #333; position: relative; cursor: pointer; }
    .big-grid-item .icon-bg { font-size: 28px; margin-bottom: 5px; display: inline-block;}
    .big-grid-item p { color: #ff9800; font-size: 11px; margin-top: 2px;}
    
    .loan-banner { background: linear-gradient(90deg, #fff5e6, #ffebd2); border-radius: 12px; margin: 10px 15px; padding: 15px; }
    .loan-header { display: flex; justify-content: space-between; font-size: 15px; font-weight: bold; margin-bottom: 10px;}
    .loan-tags { display: flex; gap: 10px; font-size: 12px; color: #ff9800; font-weight: normal; }
    .loan-content { display: flex; justify-content: space-between; align-items: flex-end;}
    .loan-content h2 { font-size: 32px; font-weight: normal;}
    .loan-content .btn-borrow { background: #ff8c00; color: #fff; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 15px;}
    .loan-footer { font-size: 12px; color: #999; margin-top: 10px;}

    .ad-cards { display: flex; gap: 10px; margin: 10px 15px; overflow-x: auto; padding-bottom: 10px;}
    .ad-card { flex: 1; border-radius: 12px; padding: 15px; min-width: 110px; display: flex; flex-direction: column; justify-content: space-between;}
    .ad-card h4 { font-size: 15px; font-weight: bold; margin-bottom: 5px;}
    .ad-card p { font-size: 12px; opacity: 0.8; margin-bottom: 10px;}
    .ad-card .ad-btn { background: #ff3b30; color: #fff; text-align: center; padding: 6px; border-radius: 15px; font-size: 12px; font-weight: bold;}
    .ad-card.red { background: #ffe6e6; color: #ff3b30;}
    .ad-card.yellow { background: #fff8e1; color: #ff9800;}
    .ad-card.pink { background: #fce4ec; color: #e91e63;}

    .channel-tabs { display: flex; justify-content: space-around; background: #fff; padding: 15px 0; font-size: 15px; margin-top: 10px;}
    .channel-tabs span { color: #666; }
    .channel-tabs span.active { color: #ff8200; font-weight: bold; position: relative;}
    .channel-tabs span.active::after { content: ''; position: absolute; bottom: -15px; left: 50%; transform: translateX(-50%); width: 20px; height: 3px; background: #ff8200; }

    .section-block { background: #fff; padding: 15px; margin: 10px 0; }
    .section-block h3 { font-size: 16px; margin-bottom: 15px;}
    .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 20px 0; text-align: center; font-size: 12px;}
    .grid-5 .icon { font-size: 26px; margin-bottom: 5px;}

    /* ====== 页面 3：基金首页 ====== */
    #page3 { background: #f5f5f5; padding-bottom: 60px; }
    .fund-top-bg { background: linear-gradient(180deg, #ff3b30 0%, #ff6b61 100%); padding: 50px 15px 70px; color: #fff; position: relative;}
    .fund-search { background: rgba(255,255,255,0.25); border-radius: 20px; padding: 8px 15px; font-size: 13px; display: flex; align-items: center; gap: 5px; margin-bottom: 20px; }
    .fund-asset-row { display: flex; justify-content: space-between; align-items: flex-end;}
    .fund-asset-item h4 { font-size: 13px; opacity: 0.9; margin-bottom: 5px; font-weight: normal; display: flex; align-items: center; gap: 5px;}
    .fund-asset-item .val { font-size: 28px; font-weight: bold; }
    .fund-asset-item .profit-val { font-size: 24px; font-weight: bold; display: flex; align-items: center; gap: 5px; cursor: pointer;}

    .star-fund-card { background: #fff; border-radius: 16px; margin: -50px 15px 15px; padding: 20px; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 2px solid #ffe0b2;}
    .star-tag { background: #ffebee; color: #ff3b30; font-size: 12px; padding: 4px 12px; border-radius: 15px; display: inline-block; margin-bottom: 15px; font-weight: bold;}
    .star-fund-card h3 { font-size: 18px; color: #333; margin-bottom: 5px; text-align: center;}
    .star-fund-card h4 { font-size: 16px; color: #666; margin-bottom: 15px; text-align: center; font-weight: normal;}
    .big-rate-area { text-align: center; position: relative; margin-bottom: 15px;}
    .big-rate-area .rate { font-size: 46px; color: #ff3b30; font-weight: bold; }
    .big-rate-area .desc { font-size: 12px; color: #999; }
    .chart-mock { position: absolute; left: 0; bottom: 10px; width: 100px; height: 50px; background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 100 50" xmlns="http://www.w3.org/2000/svg"><path d="M0 40 L20 30 L40 35 L60 10 L80 20 L100 5" fill="none" stroke="%23ff3b30" stroke-width="2"/></svg>') no-repeat; background-size: contain;}
    .tags-right { position: absolute; right: 0; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; gap: 8px; font-size: 12px; color: #666;}
    .tags-right span::before { content: '✓'; color: #ffb74d; margin-right: 4px;}
    .btn-buy-red { background: #ff3b30; color: #fff; text-align: center; padding: 12px; border-radius: 25px; font-size: 16px; font-weight: bold; margin-top: 10px; cursor: pointer;}

    .fund-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 15px 0; padding: 10px 15px; text-align: center; font-size: 12px; color: #333;}
    .fund-grid-5 .icon { font-size: 28px; margin-bottom: 5px; color: #666;}
    .fund-grid-5 .icon.red { color: #ff3b30;}

    .blue-ad { background: linear-gradient(90deg, #0033cc, #0044ff); margin: 15px; border-radius: 8px; padding: 20px; text-align: center; color: #fff;}
    .blue-ad h3 { font-size: 18px; margin-bottom: 5px; font-weight: bold;}
    .blue-ad p { font-size: 13px; opacity: 0.9; margin-bottom: 10px;}
    .blue-ad span { background: rgba(255,255,255,0.2); padding: 4px 15px; border-radius: 15px; font-size: 12px;}

    .fund-bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; display: flex; background: #fff; padding: 8px 0; border-top: 1px solid #eee; z-index: 10;}
    .fund-nav-item { flex: 1; text-align: center; font-size: 11px; color: #999; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;}
    .fund-nav-item.active { color: #ff3b30;}
    .fund-nav-item i { font-style: normal; font-size: 22px;}

    /* ====== 页面 5：基金“我的”（长图滚动） ====== */
    #page5 { background: #f5f5f5; padding-bottom: 60px;}
    .my-fund-top { background: linear-gradient(180deg, #ff3b30 0%, #ff5b3e 100%); padding: 50px 15px 20px; color: #fff;}
    .my-fund-user { display: flex; align-items: center; gap:
